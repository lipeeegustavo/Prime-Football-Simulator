name: apply v26 gameplay stability and corners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v25-penalty-receive-numbering.yml'
      - 'tools/apply_v26.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v26 gameplay fixes
        run: python tools/apply_v26.py
      - name: Validate syntax
        run: |
          node --check js/simulation/matchEngine.js
          node --check js/runtime/coreStabilityV24.js
          node --check js/runtime/physicalSetPiecesV21.js
      - name: Commit v26
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/simulation/matchEngine.js js/runtime/coreStabilityV24.js js/runtime/physicalSetPiecesV21.js
          git commit -m 'fix: unstick match flow and animate corners'
          git push
