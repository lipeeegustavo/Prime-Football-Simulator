name: apply v25 penalty receive and numbering fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v25-penalty-receive-numbering.yml'
      - 'tools/apply_v25.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v25 fixes
        run: python tools/apply_v25.py
      - name: Validate syntax
        run: |
          node --check js/squad/squadBuilder.js
          node --check js/render/pitchRenderer.js
          node --check js/simulation/matchEngine.js
      - name: Commit v25
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/squad/squadBuilder.js js/render/pitchRenderer.js js/simulation/matchEngine.js
          git commit -m 'fix: polish penalties receiving and shirt numbers'
          git push
