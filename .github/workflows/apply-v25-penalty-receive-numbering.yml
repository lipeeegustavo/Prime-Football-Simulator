name: apply v25 penalty receive and numbering fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v25-penalty-receive-numbering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v25 fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  print('pattern missing/already patched:', label)
                  return False
              p.write_text(s.replace(old,new,1))
              print('patched:', label)
              return True

          # ------------------------------------------------------------
          # 1) Football shirt numbers: position-aware and deterministic.
          # ------------------------------------------------------------
          p=Path('js/squad/squadBuilder.js'); s=p.read_text()
          start=s.index('  function ensureShirtNumbers(team){')
          end=s.index('  function shirtNumber(team,id)', start)
          new_numbers=r'''  function ensureShirtNumbers(team){
    // Numeração de futebol: os titulares recebem números coerentes com a
    // posição, sem repetição. Reservas usam os próximos números livres.
    const positional={
      GOL:[1,12,23],LD:[2,22,14],LE:[3,6,16],ZAG:[4,5,13,15],VOL:[5,6,8,14],
      MC:[8,6,7,10],MEI:[10,8,7,11],PD:[7,11,17],PE:[11,7,17],CA:[9,10,19],SA:[10,9,11],ALA:[2,3,6,7]
    };
    const numbers={},used=new Set(),positions=FORMATIONS[team.formation]||[];
    const take=(prefs)=>{const n=(prefs||[]).find(v=>!used.has(v))||Array.from({length:99},(_,i)=>i+1).find(v=>!used.has(v));used.add(n);return n;};
    (team.starters||[]).forEach((id,i)=>{
      if(!id)return;
      const pos=positions[i]||playerById(id)?.positions?.[0]||'MC';
      numbers[String(id)]=take(positional[pos]||[]);
    });
    (team.bench||[]).forEach(id=>{
      if(!id||numbers[String(id)])return;
      const preferred=Array.from({length:88},(_,i)=>i+12);
      numbers[String(id)]=take(preferred);
    });
    team.numbers=numbers;
    team.numberingVersion='football-v2';
    return team.numbers;
  }
'''
          p.write_text(s[:start]+new_numbers+s[end:])
          print('patched: position-aware shirt numbers')

          # ------------------------------------------------------------
          # 2) Renderer target state: only current receiver gets a lime ring.
          # ------------------------------------------------------------
          path='js/render/pitchRenderer.js'
          replace_once(path,
            "  function setCarrier(key,id){\n    if(!scene)return;const p=findPlayerById(key,id);scene.carrier=p||null;scene.target=null;\n    if(p){Prime.Ball.setControlled(scene.ball,p.x,p.y,key,p.index);setAnim(p,'control',.35);}\n  }",
            "  function clearTargets(){if(!scene)return;scene.players.forEach(p=>p.targeted=false);}\n  function setCarrier(key,id){\n    if(!scene)return;clearTargets();const p=findPlayerById(key,id);scene.carrier=p||null;scene.target=null;\n    if(p){Prime.Ball.setControlled(scene.ball,p.x,p.y,key,p.index);setAnim(p,'control',.35);}\n  }",
            'clear stale receiver rings on carrier')
          replace_once(path,
            "  function setTarget(key,id){if(!scene)return;scene.target=findPlayerById(key,id)||null;}",
            "  function setTarget(key,id){if(!scene)return;clearTargets();scene.target=findPlayerById(key,id)||null;if(scene.target)scene.target.targeted=true;}",
            'single active target ring')
          replace_once(path,
            "    if(!scene)return null;const t=findPlayerById(teamKey,playerId);if(!t)return null;scene.target=t;t.targeted=true;const opts=options||{},lead=Math.max(0,Math.min(.65,Number(opts.leadSeconds)||0)),tx=Math.max(1,Math.min(F.width-1,t.x+t.vx*lead)),ty=Math.max(1,Math.min(F.length-1,t.y+t.vy*lead));",
            "    if(!scene)return null;const t=findPlayerById(teamKey,playerId);if(!t)return null;setTarget(teamKey,playerId);const opts=options||{},lead=Math.max(0,Math.min(.65,Number(opts.leadSeconds)||0)),tx=Math.max(1,Math.min(F.width-1,t.x+t.vx*lead)),ty=Math.max(1,Math.min(F.length-1,t.y+t.vy*lead));",
            'kick uses canonical target state')

          # ------------------------------------------------------------
          # 3) Receive fallback: NEVER teleport the receiver to the ball.
          # ------------------------------------------------------------
          p=Path(path); s=p.read_text()
          old=r'''  function completeReceive(action,target,result){
    const fallback=Boolean(result&&(result.fallback||result.timeout));
    if(fallback){target.x=scene.ball.x;target.y=scene.ball.y;target.tx=target.x;target.ty=target.y;}
    else{scene.ball.x=target.x;scene.ball.y=target.y;}
    scene.ball.z=0;scene.ball.vx=scene.ball.vy=scene.ball.vz=0;setCarrier(target.key,target.id);setAnim(target,'control',.35);const cb=action.done;scene.action=null;cb&&cb(result||{});
  }'''
          new=r'''  function completeReceive(action,target,result){
    // A recepção só termina quando jogador e bola realmente se encontram.
    // Nunca movemos o jogador instantaneamente para a posição da bola.
    scene.ball.x=target.x;scene.ball.y=target.y;scene.ball.z=0;scene.ball.vx=scene.ball.vy=scene.ball.vz=0;
    clearTargets();setCarrier(target.key,target.id);setAnim(target,'control',.35);const cb=action.done;scene.action=null;cb&&cb(result||{});
  }'''
          if old in s:s=s.replace(old,new,1);print('patched: receive completion no teleport')
          else:print('pattern missing/already patched: receive completion')

          old=r'''      if(a.phase==='travel'){
        const dist=Math.hypot(scene.ball.x-t.x,scene.ball.y-t.y),speed=Math.hypot(scene.ball.vx,scene.ball.vy),height=scene.ball.z||0;
        if(dist<1.35&&height<2.2){completeReceive(a,t,{received:true});return;}
        if(speed<.3||scene.ball.state==='dead'){
          a.stallElapsed=(a.stallElapsed||0)+dt;t.tx=scene.ball.x;t.ty=scene.ball.y;
          if(a.stallElapsed>.28||a.elapsed>1.9){completeReceive(a,t,{fallback:true});return;}
        }
        if(a.elapsed>=(B.receiveTimeout||2.5)){completeReceive(a,t,{timeout:true});return;}
      }'''
          new=r'''      if(a.phase==='travel'){
        let dx=scene.ball.x-t.x,dy=scene.ball.y-t.y,dist=Math.hypot(dx,dy),speed=Math.hypot(scene.ball.vx,scene.ball.vy),height=scene.ball.z||0;
        if(dist<1.35&&height<2.2){completeReceive(a,t,{received:true});return;}
        // Se o passe perde força, o receptor CORRE até a bola. O deslocamento
        // é limitado pela velocidade do atleta, portanto não existe salto.
        if(speed<.45||scene.ball.state==='dead'||a.elapsed>=(B.receiveTimeout||2.5)){
          a.stallElapsed=(a.stallElapsed||0)+dt;
          if(a.elapsed>=(B.receiveTimeout||2.5)){scene.ball.vx*=Math.max(0,1-dt*5);scene.ball.vy*=Math.max(0,1-dt*5);if(Math.hypot(scene.ball.vx,scene.ball.vy)<.25){scene.ball.vx=scene.ball.vy=0;scene.ball.state='dead';}}
          t.tx=scene.ball.x;t.ty=scene.ball.y;
          dx=scene.ball.x-t.x;dy=scene.ball.y-t.y;dist=Math.hypot(dx,dy);
          if(dist>.001){const step=Math.min(dist,Math.max(4.8,t.maxSpeed||6)*1.15*dt);t.x+=dx/dist*step;t.y+=dy/dist*step;}
          dist=Math.hypot(scene.ball.x-t.x,scene.ball.y-t.y);
          if(dist<1.35&&(scene.ball.z||0)<2.2){completeReceive(a,t,{recovered:true});return;}
        }
      }'''
          if old in s:s=s.replace(old,new,1);print('patched: smooth receiver recovery')
          else:print('pattern missing/already patched: receive travel')
          p.write_text(s)

          # ------------------------------------------------------------
          # 4) Penalty presentation: empty pitch, ball OR glove only.
          # ------------------------------------------------------------
          p=Path(path); s=p.read_text()
          pattern=r"  function drawPenaltyCinematic\(s\)\{.*?\n  \}\n\n  function draw\(s\)\{.*?\n\n  function kickToPlayer"
          replacement=r'''  function drawPenaltyCinematic(s){
    const a=s.action;if(!a||a.type!=='penalty')return;
    const ctx=s.ctx,W=Math.min(s.canvas.width*.88,980),H=Math.min(s.canvas.height*.72,570),x=(s.canvas.width-W)/2,y=(s.canvas.height-H)/2;
    ctx.save();ctx.fillStyle='rgba(2,10,6,.88)';roundRect(ctx,x,y,W,H,18);ctx.fill();ctx.strokeStyle='rgba(182,242,58,.32)';ctx.lineWidth=2;ctx.stroke();
    const gx=x+W*.12,gy=y+H*.12,gw=W*.76,gh=H*.55,depth=Math.max(18,H*.06),bgx=gx+gw*.045,bgy=gy-depth,bgw=gw*.91,bgh=gh*.93;
    ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(4,W*.004);ctx.strokeRect(gx,gy,gw,gh);ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=1.4;ctx.strokeRect(bgx,bgy,bgw,bgh);
    for(let i=1;i<8;i++){const xx=gx+gw*i/8;ctx.beginPath();ctx.moveTo(xx,gy);ctx.lineTo(bgx+bgw*i/8,bgy+bgh);ctx.stroke();}
    for(let i=1;i<5;i++){const yy=gy+gh*i/5;ctx.beginPath();ctx.moveTo(gx,yy);ctx.lineTo(gx+gw,yy);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(bgx,bgy);ctx.moveTo(gx+gw,gy);ctx.lineTo(bgx+bgw,bgy);ctx.stroke();
    const role=a.interactiveRole||'auto',flight=a.phase==='flight'||a.phase==='hold'?Math.max(0,Math.min(1,(a.flightElapsed||0)/(a.flightDuration||.78))):0;
    const ease=1-Math.pow(1-flight,2.2),col=a.shotZone%3,row=Math.floor(a.shotZone/3),shotX=[.18,.5,.82][col];
    const targetX=a.resultKind==='WIDE'?(col===0?-.07:1.07):shotX,targetY=a.resultKind==='OVER'?-.16:[.18,.48,.79][row];
    if(role!=='keeper'){
      const bx=gx+gw*(.5+(targetX-.5)*ease),by=gy+gh*(1.08+(targetY-1.08)*ease)-Math.sin(Math.PI*flight)*gh*.08,br=Math.max(7,W*.008);
      ctx.fillStyle='#fff';ctx.strokeStyle='#142018';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx-br*.7,by);ctx.lineTo(bx+br*.7,by);ctx.moveTo(bx,by-br*.7);ctx.lineTo(bx,by+br*.7);ctx.stroke();
    }else{
      const dcol=a.diveZone%3,drow=Math.floor(a.diveZone/3),dx=[.18,.5,.82][dcol],dy=[.20,.50,.78][drow],q=a.phase==='runup'?0:Math.max(0,Math.min(1,(a.flightElapsed||0)/.58));
      const hx=gx+gw*(.5+(dx-.5)*q),hy=gy+gh*(.72+(dy-.72)*q);
      ctx.font=`${Math.max(42,W*.055)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧤',hx,hy);
    }
    ctx.fillStyle='#F2F7F3';ctx.textAlign='center';ctx.font=`800 ${Math.max(14,W*.017)}px system-ui`;
    ctx.fillText(role==='keeper'?'DEFESA · acompanhe a mão do goleiro':'COBRANÇA · acompanhe a bola',x+W*.5,y+H*.86);
    if(a.phase==='hold'){const labels={GOAL:['GOL!','#B6F23A'],SAVE:['DEFESA!','#FFC93C'],OVER:['POR CIMA!','#FF5A5F'],WIDE:['PARA FORA!','#FF5A5F']},it=labels[a.resultKind]||['FIM','#fff'];ctx.font=`900 ${Math.max(26,W*.045)}px system-ui`;ctx.fillStyle=it[1];ctx.fillText(it[0],x+W*.5,y+H*.075);}
    ctx.restore();
  }

  function draw(s){
    if(!s||!s.ctx)return;
    drawField(s);
    // Durante pênalti, o campo fica limpo: nenhum dos 22 jogadores,
    // árbitro ou minimapa compete visualmente com a cobrança.
    if(s.action?.type==='penalty'){drawPenaltyCinematic(s);return;}
    drawArrow(s);for(const p of s.players)drawPlayerCircle(s,p);drawReferee(s);drawBall(s);drawMiniMap(s);
  }

  function kickToPlayer'''
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not replace penalty cinematic/draw block')
          p.write_text(ns);print('patched: clean penalty cinematic')

          # Carry interaction role into penalty action.
          p=Path(path); s=p.read_text()
          old="scene.action={type:'penalty',phase:'runup',elapsed:0,impactAt:.72,flightElapsed:0,flightDuration:.78,done,scored,resultKind,teamKey,shooterId:String(shooterId),shooterLabel:shooter?.label||shooter?.name||'Cobrador',shotZone,diveZone,top,startX,startY,strikeX,strikeY};"
          new="scene.action={type:'penalty',phase:'runup',elapsed:0,impactAt:.72,flightElapsed:0,flightDuration:.78,done,scored,resultKind,interactiveRole:meta?.interactiveRole||'auto',teamKey,shooterId:String(shooterId),shooterLabel:shooter?.label||shooter?.name||'Cobrador',shotZone,diveZone,top,startX,startY,strikeX,strikeY};"
          if old in s:s=s.replace(old,new,1);print('patched: penalty role metadata')
          else:print('pattern missing/already patched: penalty role metadata')
          p.write_text(s)

          # ------------------------------------------------------------
          # 5) Match engine tells renderer whether human chose shot or dive.
          # ------------------------------------------------------------
          p=Path('js/simulation/matchEngine.js'); s=p.read_text()
          old="if(Prime.Pitch?.playPenalty)Prime.Pitch.playPenalty(pn.team,pn.shooterId,shotZone,diveZone,scored,next,{resultKind});else next();"
          new="if(Prime.Pitch?.playPenalty)Prime.Pitch.playPenalty(pn.team,pn.shooterId,shotZone,diveZone,scored,next,{resultKind,interactiveRole:pn.humanShooter?'shooter':pn.humanKeeper?'keeper':'auto'});else next();"
          if old in s:s=s.replace(old,new,1);print('patched: engine penalty interaction role')
          else:print('pattern missing/already patched: engine penalty role')
          p.write_text(s)
          PY

          node --check js/squad/squadBuilder.js
          node --check js/render/pitchRenderer.js
          node --check js/simulation/matchEngine.js
      - name: Commit v25
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/squad/squadBuilder.js js/render/pitchRenderer.js js/simulation/matchEngine.js
          git commit -m 'fix: polish penalties receiving and shirt numbers'
          git push
