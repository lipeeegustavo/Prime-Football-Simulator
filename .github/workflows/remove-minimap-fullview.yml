name: hide minimap in full field view

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-minimap-fullview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hide minimap when camera is full field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/render/pitchRenderer.js')
          s = p.read_text()
          old = "  function drawMiniMap(s){\n    if(s.preview)return;"
          new = "  function drawMiniMap(s){\n    if(s.preview||s.camera?.mode==='full')return;"
          if old not in s:
              raise SystemExit('drawMiniMap pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check js/render/pitchRenderer.js
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/render/pitchRenderer.js
          git commit -m 'fix: hide minimap in full field camera'
          git push
