name: apply v24 pass fallback cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v24-pass-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove receive teleport fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/render/pitchRenderer.js')
          s=p.read_text()
          old="  function completeReceive(action,target,result){\n    scene.ball.x=target.x;scene.ball.y=target.y;scene.ball.vx=scene.ball.vy=0;setCarrier(target.key,target.id);setAnim(target,'control',.35);const cb=action.done;scene.action=null;cb&&cb(result||{});\n  }"
          new="  function completeReceive(action,target,result){\n    const fallback=Boolean(result&&(result.fallback||result.timeout));\n    if(fallback){target.x=scene.ball.x;target.y=scene.ball.y;target.tx=target.x;target.ty=target.y;}\n    else{scene.ball.x=target.x;scene.ball.y=target.y;}\n    scene.ball.z=0;scene.ball.vx=scene.ball.vy=scene.ball.vz=0;setCarrier(target.key,target.id);setAnim(target,'control',.35);const cb=action.done;scene.action=null;cb&&cb(result||{});\n  }"
          if old in s:
              p.write_text(s.replace(old,new))
              print('patched receive fallback')
          else:
              print('already patched or pattern not found')
          PY
          node --check js/render/pitchRenderer.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/render/pitchRenderer.js
          git commit -m 'fix: keep ball continuous on receive fallback'
          git push
