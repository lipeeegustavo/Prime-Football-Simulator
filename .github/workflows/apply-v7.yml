name: Apply v7 Production
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: bash tools/apply-v7.sh
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Compile C++ physics
        run: emcc physics/ball_physics.cpp -O3 -s WASM=1 -s MODULARIZE=1 -s EXPORT_NAME=createPrimePhysicsModule -s ENVIRONMENT=web -s EXPORTED_FUNCTIONS='["_physics_step","_physics_get_x","_physics_get_y","_physics_get_z","_physics_get_vx","_physics_get_vy","_physics_get_vz","_physics_get_spin","_physics_get_rotation","_physics_is_stopped"]' -o physics/ball_physics.js
      - name: Validate JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/main.css js/render/pitchRenderer.js js/world/ball.js js/world/physicsBridge.js physics/ball_physics.cpp physics/ball_physics.js physics/ball_physics.wasm
          git commit -m "feat: v7 broadcast field with C++ WebAssembly physics"
          git push
