name: Apply v8.1 Continuity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v8-1-continuity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run continuity patch
        run: python tools/apply_v8_1.py
      - name: Validate JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit continuity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js
          git commit -m "fix: preserve live positions and block new events during restart transitions" || exit 0
          git push
