name: apply v27 penalty cinematic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v27-penalty-cinematic.yml'
      - 'tools/apply_v27_penalty_cinematic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v27 penalty cinematic fixes
        run: python tools/apply_v27_penalty_cinematic.py
      - name: Validate syntax
        run: |
          node --check js/animation/gameLoop.js
          node --check js/render/pitchRenderer.js
          node --check js/simulation/matchEngine.js
      - name: Commit v27
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Prime Football CI'
          git config user.email 'actions@users.noreply.github.com'
          git add js/animation/gameLoop.js js/render/pitchRenderer.js js/simulation/matchEngine.js
          git commit -m 'fix: add clean penalty shootout cinematic'
          git push
