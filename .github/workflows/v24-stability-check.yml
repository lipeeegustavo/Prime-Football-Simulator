name: v24 stability check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: find js tests -name '*.js' -o -name '*.mjs' | while read f; do node --check "$f"; done
      - name: V24 smoke checks
        run: node tests/v24-smoke.mjs
