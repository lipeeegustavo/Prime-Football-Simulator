name: Apply v9 Penalty and Card Polish v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v9-penalty-cards-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v9.py')
          s=p.read_text()
          s=s.replace("drawPenaltyCinematic(s);}\"\nif anchor", "drawPenaltyCinematic(s);}\"\"\"\nif anchor")
          p.write_text(s)
          PY
      - name: Apply v9 gameplay patch
        run: python tools/apply_v9.py
      - name: Validate JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit v9 production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v9 penalty cinematic, 3D goal and card reasons" || exit 0
          git push
