name: Sync working v6.1

on:
  push:
    paths:
      - SYNC_V61_WORKING

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply working v6.1 fixes
        shell: python
        run: |
          from pathlib import Path

          pitch = Path('js/render/pitchRenderer.js')
          text = pitch.read_text(encoding='utf-8')
          text = text.replace(
              "function shoot(teamKey,playerId,outcome,done){\n    if(!scene){done&&done({missing:true});return;}const shooter=findPlayerById(teamKey,playerId)||scene.carrier;if(!shooter){done&&done({missing:true});return;}\n    setCarrier(teamKey,shooterId);",
              "function shoot(teamKey,shooterId,outcome,done){\n    if(!scene){done&&done({missing:true});return;}const shooter=findPlayerById(teamKey,shooterId)||scene.carrier;if(!shooter){done&&done({missing:true});return;}\n    setCarrier(teamKey,shooterId);"
          )
          pitch.write_text(text, encoding='utf-8')

          screens = Path('js/ui/screens.js')
          text = screens.read_text(encoding='utf-8')
          old = "    if(evt.type==='GOAL')showOverlay('GOL!','goal',1500);if(evt.type==='HALF_TIME')showOverlay('INTERVALO','',1400);"
          new = old + "\n    if(evt.type==='YELLOW_CARD'){const p=Squad.playerById(evt.data?.playerId);showOverlay(`🟨 AMARELO${p?' · '+Squad.surname(p.name):''}`,'card-yellow',1800);}\n    if(evt.type==='RED_CARD'){const p=Squad.playerById(evt.data?.playerId);showOverlay(`🟥 VERMELHO${p?' · '+Squad.surname(p.name):''}`,'card-red',2100);}\n    if(evt.type==='PENALTY_KICK')showOverlay(evt.data?.scored?'⚽ GOL NO PÊNALTI':'🧤 PÊNALTI PERDIDO',evt.data?.scored?'goal':'penalty-miss',1500);"
          if "evt.type==='YELLOW_CARD'" not in text[text.find('function onMatchEvent'):text.find('function updateMatchHud')]:
              text = text.replace(old, new)
          screens.write_text(text, encoding='utf-8')

          css = Path('css/main.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* v6.1 — feedback visual da partida */'
          if marker not in text:
              text += "\n\n" + marker + "\n.match-overlay.card-yellow .overlay-card{color:#FFD43B;font-size:clamp(1.7rem,6vw,4.2rem);letter-spacing:-.035em}\n.match-overlay.card-red .overlay-card{color:#FF5A5F;font-size:clamp(1.7rem,6vw,4.2rem);letter-spacing:-.035em}\n.match-overlay.penalty-miss .overlay-card{color:#F3F6FB;font-size:clamp(1.6rem,5.5vw,3.8rem);letter-spacing:-.035em}\n"
          css.write_text(text, encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit synced project
        shell: bash
        run: |
          set -e
          rm -f SYNC_V61_WORKING .github/workflows/sync-v61-working.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync working v6.1 runtime for Vercel"
          git push
