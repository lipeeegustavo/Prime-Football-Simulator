name: Publish Prime Football Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - PUBLISH_PROJECT

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and unpack project
        shell: bash
        run: |
          set -euo pipefail
          cat .project-payload/part-* > project.tar.xz.b64
          base64 -d project.tar.xz.b64 > project.tar.xz
          tar -xJf project.tar.xz
          rm -rf project.tar.xz project.tar.xz.b64 .project-payload PUBLISH_PROJECT

      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: publish Prime Football Simulator v6"
          git push
