name: Upgrade v7 Broadcast + C++ Physics v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v7-broadcast-wasm-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch horizontal renderer, WASM bridge and UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('js/render/pitchRenderer.js'); s=p.read_text()
          repl=r'''  // Broadcast horizontal: comprimento do campo no eixo X da tela.
  function cameraWorldToCanvas(s,x,y){
    const c=s.camera,canvas=s.canvas;if(c.mode==='full')return fullWorldToCanvas(s,x,y);
    const margin=18*Math.min(2,window.devicePixelRatio||1),usableW=canvas.width-margin*2,usableH=canvas.height-margin*2;
    const fullScale=Math.min(usableW/(F.length+F.goalDepth*2),usableH/F.width),scale=fullScale*c.zoom;
    return {x:canvas.width/2+(y-c.y)*scale,y:canvas.height/2+(x-c.x)*scale,scale};
  }
  function fullWorldToCanvas(s,x,y){
    const canvas=s.canvas,margin=18*Math.min(2,window.devicePixelRatio||1),totalLen=F.length+F.goalDepth*2;
    const scale=Math.min((canvas.width-margin*2)/totalLen,(canvas.height-margin*2)/F.width),drawW=totalLen*scale,drawH=F.width*scale,ox=(canvas.width-drawW)/2,oy=(canvas.height-drawH)/2;
    return {x:ox+(y+F.goalDepth)*scale,y:oy+x*scale,scale};
  }
  function updateCamera(s,dt){
    const c=s.camera;if(c.mode==='full'){c.x=F.width/2;c.y=F.length/2;return;}
    const focus=s.ball||s.carrier||{x:F.width/2,y:F.length/2},poss=s.state?.match?.poss||s.carrier?.key||'A',dir=visualAttacksTop(poss)?-1:1;
    c.targetX=focus.x;c.targetY=focus.y+dir*(B.camera?.lookAhead||5.5);const smooth=1-Math.exp(-(B.camera?.smoothing||4.6)*Math.max(0,dt));c.x+=(c.targetX-c.x)*smooth;c.y+=(c.targetY-c.y)*smooth;
    const margin=18*Math.min(2,window.devicePixelRatio||1),usableW=s.canvas.width-margin*2,usableH=s.canvas.height-margin*2,fullScale=Math.min(usableW/(F.length+F.goalDepth*2),usableH/F.width),scale=fullScale*(c.zoom||2.05),halfLateral=Math.min(F.width/2,usableH/(2*scale)),halfLength=Math.min((F.length+F.goalDepth*2)/2,usableW/(2*scale));
    c.x=Math.max(halfLateral,Math.min(F.width-halfLateral,c.x));c.y=Math.max(-F.goalDepth+halfLength,Math.min(F.length+F.goalDepth-halfLength,c.y));
  }

  function pathField'''
          s,n=re.subn(r'  function cameraWorldToCanvas\(s,x,y\)\{.*?\n  function pathField',repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('projection replacement failed')
          mini=r'''  function drawMiniMap(s){
    if(s.preview)return;const ctx=s.ctx,w=Math.min(190,s.canvas.width*.22),h=w*(F.width/F.length),x=(s.canvas.width-w)/2,y=s.canvas.height-h-12;ctx.save();ctx.fillStyle='rgba(5,20,10,.82)';roundRect(ctx,x,y,w,h,10);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.36)';ctx.stroke();const pad=8,fx=x+pad,fy=y+pad,fw=w-pad*2,fh=h-pad*2;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.strokeRect(fx,fy,fw,fh);ctx.beginPath();ctx.moveTo(fx+fw/2,fy);ctx.lineTo(fx+fw/2,fy+fh);ctx.stroke();for(const pl of s.players){const px=fx+pl.y/F.length*fw,py=fy+pl.x/F.width*fh;ctx.fillStyle=pl.key==='A'?'#3B82F6':'#FF6B35';ctx.beginPath();ctx.arc(px,py,2.8,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(fx+s.ball.y/F.length*fw,fy+s.ball.x/F.width*fh,2.5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function draw(s)'''
          s,n=re.subn(r'  function drawMiniMap\(s\)\{.*?\n  function draw\(s\)',mini,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('minimap replacement failed')
          p.write_text(s)

          p=Path('js/world/ball.js'); s=p.read_text()
          marker="    if(ball.returnDelay>0)ball.returnDelay=Math.max(0,ball.returnDelay-dt);\n"
          inject=marker+"    if(Prime.PhysicsBridge&&Prime.PhysicsBridge.isReady&&Prime.PhysicsBridge.isReady()){Prime.PhysicsBridge.step(ball,dt);return;}\n"
          if 'Prime.PhysicsBridge.step(ball,dt)' not in s:
            if marker not in s: raise SystemExit('ball marker missing')
            s=s.replace(marker,inject,1)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text(); marker='  <script src="js/world/fieldGeometry.js"></script>\n'
          if 'physics/ball_physics.js' not in s:s=s.replace(marker,marker+'  <script src="physics/ball_physics.js"></script>\n  <script src="js/world/physicsBridge.js"></script>\n',1)
          p.write_text(s)

          p=Path('css/main.css'); s=p.read_text()
          if 'v7-broadcast-horizontal' not in s:s+='''\n\n/* v7-broadcast-horizontal */\n.match-page{max-width:1600px;margin:0 auto}.match-grid{display:block!important}.stadium-card{padding:5px;background:#07160D;border-radius:14px}.pitch-stage{width:100%;aspect-ratio:16/9;min-height:0!important;max-height:none!important;overflow:hidden}.pitch-canvas{width:100%!important;height:100%!important;min-height:0!important;display:block}.scoreboard{border-radius:12px;padding:8px 14px}.narration-drawer{position:absolute;right:10px;top:52px;bottom:10px;width:min(360px,35vw);z-index:10;transform:translateX(calc(100% + 18px));transition:.22s ease;pointer-events:none}.narration-drawer.open{transform:translateX(0);pointer-events:auto}@media(max-width:700px){.pitch-stage{aspect-ratio:16/10;min-height:0!important}.pitch-canvas{height:100%!important;min-height:0!important}.narration-drawer{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:min(50svh,400px);transform:translateY(calc(100% + 18px))}.narration-drawer.open{transform:translateY(0)}}\n'''
          p.write_text(s)
          PY
          mkdir -p physics js/world
          cat > js/world/physicsBridge.js <<'EOF'
          (function(Prime){let module=null,loading=false,failed=false;function boot(){if(module||loading||failed)return;if(typeof window.createPrimePhysicsModule!=='function'){failed=true;return;}loading=true;window.createPrimePhysicsModule({locateFile:path=>'physics/'+path}).then(m=>{module=m;loading=false;console.info('[Prime] C++ physics/WASM ativo.');}).catch(e=>{loading=false;failed=true;console.warn('[Prime] fallback JS de física ativo.',e);});}function isReady(){if(!module&&!loading&&!failed)boot();return!!module;}function step(ball,dt){if(!module)return false;const mode=ball.state==='controlled'?1:(ball.state==='dead'?0:2),tx=Number.isFinite(ball.targetX)?ball.targetX:ball.x,ty=Number.isFinite(ball.targetY)?ball.targetY:ball.y,ox=ball.x,oy=ball.y;module._physics_step(ball.x,ball.y,ball.z,ball.vx,ball.vy,ball.vz,ball.spin,ball.rotation,tx,ty,Math.min(.05,Math.max(0,dt)),mode);ball.x=module._physics_get_x();ball.y=module._physics_get_y();ball.z=module._physics_get_z();ball.vx=module._physics_get_vx();ball.vy=module._physics_get_vy();ball.vz=module._physics_get_vz();ball.spin=module._physics_get_spin();ball.rotation=module._physics_get_rotation();ball.travelled+=(Math.hypot(ball.x-ox,ball.y-oy)||0);if(mode===2&&module._physics_is_stopped())ball.state='dead';return true;}Prime.PhysicsBridge=Object.freeze({boot,isReady,step});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})(window.Prime=window.Prime||{});
          EOF
          cat > physics/ball_physics.cpp <<'EOF'
          #include <cmath>
          #include <algorithm>
          namespace{struct S{double x,y,z,vx,vy,vz,spin,rot;int stop;}s;inline double h(double a,double b){return std::sqrt(a*a+b*b);}}
          extern "C"{void physics_step(double x,double y,double z,double vx,double vy,double vz,double spin,double rot,double tx,double ty,double dt,int mode){dt=std::clamp(dt,0.0,.05);s={x,y,z,vx,vy,vz,spin,rot,0};if(mode==0){s.vx=s.vy=s.vz=0;s.stop=1;return;}if(mode==1){double dx=tx-s.x,dy=ty-s.y,ax=dx*24.0-s.vx*9.2,ay=dy*24.0-s.vy*9.2,a=h(ax,ay);if(a>36){ax=ax/a*36;ay=ay/a*36;}s.vx+=ax*dt;s.vy+=ay*dt;double sp=h(s.vx,s.vy);if(sp>11.5){s.vx=s.vx/sp*11.5;s.vy=s.vy/sp*11.5;}s.z+=(0-s.z)*std::min(1.0,dt*14.0);s.vz=0;}else{bool air=s.z>.015||s.vz>.05;if(air){double d=std::exp(-.075*dt);s.vx*=d;s.vy*=d;if(std::abs(s.spin)>.001){double sp=h(s.vx,s.vy);if(sp>.2){double nx=-s.vy/sp,ny=s.vx/sp,a=std::min(7.5,std::abs(s.spin)*sp*.031),sg=s.spin<0?-1.0:1.0;s.vx+=nx*a*sg*dt;s.vy+=ny*a*sg*dt;s.spin*=std::exp(-.32*dt);}}s.vz-=16.8*dt;}else{double d=std::exp(-.31*dt);s.vx*=d;s.vy*=d;}}double ox=s.x,oy=s.y;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.rot+=h(s.x-ox,s.y-oy)/.36;if(s.z<=0){if(s.vz<0){double imp=std::abs(s.vz);s.z=0;if(imp>1.15){s.vz=imp*.39;s.vx*=.93;s.vy*=.93;}else s.vz=0;}else s.z=0;}if(s.z>14){s.z=14;s.vz=std::min(0.0,s.vz);}if(mode==2&&s.z==0&&std::abs(s.vz)<.01&&h(s.vx,s.vy)<.14){s.vx=s.vy=s.vz=s.spin=0;s.stop=1;}}double physics_get_x(){return s.x;}double physics_get_y(){return s.y;}double physics_get_z(){return s.z;}double physics_get_vx(){return s.vx;}double physics_get_vy(){return s.vy;}double physics_get_vz(){return s.vz;}double physics_get_spin(){return s.spin;}double physics_get_rotation(){return s.rot;}int physics_is_stopped(){return s.stop;}}
          EOF
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Compile WebAssembly
        run: emcc physics/ball_physics.cpp -O3 -s WASM=1 -s MODULARIZE=1 -s EXPORT_NAME=createPrimePhysicsModule -s ENVIRONMENT=web -s EXPORTED_FUNCTIONS='["_physics_step","_physics_get_x","_physics_get_y","_physics_get_z","_physics_get_vx","_physics_get_vy","_physics_get_vz","_physics_get_spin","_physics_get_rotation","_physics_is_stopped"]' -o physics/ball_physics.js
      - name: Validate and publish
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/main.css js/render/pitchRenderer.js js/world/ball.js js/world/physicsBridge.js physics/ball_physics.cpp physics/ball_physics.js physics/ball_physics.wasm
          git commit -m "feat: v7 horizontal broadcast with C++ WASM physics"
          git push
